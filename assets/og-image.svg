<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background Dot Pattern -->
    <pattern id="dot-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.5" fill="#32302f" />
    </pattern>

    <!-- Drop Shadow for Terminal Card -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Radial Glow behind Snowflake -->
    <radialGradient id="snowflake-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#83a598" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#b8bb26" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#282828" stop-opacity="0"/>
    </radialGradient>

    <style>
      .mono-title { font-family: 'JetBrains Mono', 'Fira Code', 'FiraCode Nerd Font', monospace, sans-serif; font-weight: 900; }
      .mono-bold  { font-family: 'JetBrains Mono', 'Fira Code', 'FiraCode Nerd Font', monospace, sans-serif; font-weight: 700; }
      .mono-med   { font-family: 'JetBrains Mono', 'Fira Code', 'FiraCode Nerd Font', monospace, sans-serif; font-weight: 600; }
      .mono-reg   { font-family: 'JetBrains Mono', 'Fira Code', 'FiraCode Nerd Font', monospace, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="#1d2021"/>
  <rect width="1200" height="630" fill="url(#dot-grid)"/>

  <!-- Main Terminal Window Card -->
  <g filter="url(#card-shadow)">
    <rect x="50" y="45" width="1100" height="540" rx="16" fill="#282828" stroke="#3c3836" stroke-width="2"/>
    
    <!-- Window Title Bar -->
    <path d="M 50,61 A 16,16 0 0 1 66,45 L 1134,45 A 16,16 0 0 1 1150,61 L 1150,96 L 50,96 Z" fill="#1d2021"/>
    <line x1="50" y1="96" x2="1150" y2="96" stroke="#3c3836" stroke-width="1.5"/>

    <!-- Window Control Buttons -->
    <circle cx="80" cy="71" r="6.5" fill="#fb4934"/>
    <circle cx="102" cy="71" r="6.5" fill="#fabd2f"/>
    <circle cx="124" cy="71" r="6.5" fill="#b8bb26"/>

    <!-- Terminal Header Info -->
    <text x="600" y="76" text-anchor="middle" class="mono-med" font-size="13" fill="#a89984">julian@junixos: ~/nixos-dotfiles (flake:master)</text>
  </g>

  <!-- ================= LEFT COLUMN: CONTENT ================= -->
  <!-- Pill Badge -->
  <g transform="translate(90, 126)">
    <rect width="165" height="26" rx="5" fill="#83a598" fill-opacity="0.12" stroke="#83a598" stroke-opacity="0.35" stroke-width="1"/>
    <text x="82" y="17.5" text-anchor="middle" class="mono-bold" font-size="11.5" fill="#83a598" letter-spacing="0.5">❄ NIXOS &amp; HYPRLAND</text>
  </g>

  <!-- Brand Heading -->
  <text x="90" y="210" class="mono-title" font-size="58" fill="#fabd2f" letter-spacing="-1">Irgendeinwer<tspan fill="#fe8019">.</tspan></text>
  <text x="90" y="248" class="mono-med" font-size="20" fill="#b8bb26">λ Flake-Driven &amp; Declarative Fleet Dotfiles</text>

  <!-- Fleet Cards -->
  <!-- 1. Desktop Workstation -->
  <g transform="translate(90, 280)">
    <rect width="530" height="74" rx="8" fill="#1d2021" stroke="#3c3836" stroke-width="1.2"/>
    <text x="20" y="32" class="mono-bold" font-size="16" fill="#83a598">🖥️ junixos</text>
    
    <rect x="120" y="18" width="70" height="18" rx="4" fill="#fe8019" fill-opacity="0.15"/>
    <text x="155" y="31" text-anchor="middle" class="mono-bold" font-size="10.5" fill="#fe8019">DESKTOP</text>

    <text x="20" y="55" class="mono-reg" font-size="13" fill="#ebdbb2">Intel i5-13600KF <tspan fill="#504945">•</tspan> Radeon RX 9070 <tspan fill="#504945">•</tspan> <tspan fill="#8ec07c">CachyOS</tspan></text>
  </g>

  <!-- 2. Laptop Workstation -->
  <g transform="translate(90, 368)">
    <rect width="530" height="74" rx="8" fill="#1d2021" stroke="#3c3836" stroke-width="1.2"/>
    <text x="20" y="32" class="mono-bold" font-size="16" fill="#fabd2f">💻 junixbook</text>

    <rect x="135" y="18" width="62" height="18" rx="4" fill="#b8bb26" fill-opacity="0.15"/>
    <text x="166" y="31" text-anchor="middle" class="mono-bold" font-size="10.5" fill="#b8bb26">MOBILE</text>

    <text x="20" y="55" class="mono-reg" font-size="13" fill="#ebdbb2">10th Gen Intel i5 Mobile <tspan fill="#504945">•</tspan> Hyprland Baseline</text>
  </g>

  <!-- Tag Badges -->
  <g transform="translate(90, 468)" class="mono-reg" font-size="12">
    <rect x="0" y="0" width="82" height="26" rx="5" fill="#32302f" stroke="#504945"/>
    <text x="41" y="17.5" text-anchor="middle" fill="#d3869b">#hyprland</text>

    <rect x="92" y="0" width="70" height="26" rx="5" fill="#32302f" stroke="#504945"/>
    <text x="127" y="17.5" text-anchor="middle" fill="#83a598">#flakes</text>

    <rect x="172" y="0" width="124" height="26" rx="5" fill="#32302f" stroke="#504945"/>
    <text x="234" y="17.5" text-anchor="middle" fill="#b8bb26">#home-manager</text>

    <rect x="306" y="0" width="78" height="26" rx="5" fill="#32302f" stroke="#504945"/>
    <text x="345" y="17.5" text-anchor="middle" fill="#fabd2f">#gruvbox</text>

    <rect x="394" y="0" width="74" height="26" rx="5" fill="#32302f" stroke="#504945"/>
    <text x="431" y="17.5" text-anchor="middle" fill="#fe8019">#neovim</text>
  </g>

  <!-- ================= RIGHT COLUMN: ACCURATE NIXOS SNOWFLAKE ================= -->
  <circle cx="885" cy="335" r="175" fill="url(#snowflake-glow)"/>
  <circle cx="885" cy="335" r="150" fill="none" stroke="#504945" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.35"/>

  <!-- Canonical 6-Fold NixOS Geometry in Gruvbox Palette -->
  <g transform="translate(885, 335) scale(11.2) translate(-12, -12)">
    <!-- Arm 1 (Top Left): Aqua -->
    <path d="M7.352 1.592l-1.364.002L5.32 2.75l1.557 2.713-3.137-.008-1.32 2.34H14.11l-1.353-2.332-3.192-.006-2.214-3.865z" fill="#83a598"/>
    
    <!-- Arm 2 (Top Right): Green -->
    <path d="M13.527 1.592l-2.687.025 5.846 10.127 1.341-2.34-1.59-2.765 2.24-3.85-.683-1.182h-1.336l-1.57 2.705-1.56-2.72z" fill="#b8bb26"/>
    
    <!-- Arm 3 (Right): Yellow -->
    <path d="M20.414 5.787l-5.846 10.125 2.696-.008 1.601-2.76 4.453.016.682-1.183-.666-1.157-3.13-.008L21.778 8.1l-1.365-2.313z" fill="#fabd2f"/>
    
    <!-- Arm 4 (Left): Orange -->
    <path d="M9.432 8.086l-2.696.008-1.601 2.76-4.453-.016L0 12.02l.666 1.157 3.13.008-1.575 2.71 1.365 2.315L9.432 8.086z" fill="#fe8019"/>
    
    <!-- Arm 5 (Bottom Left): Red -->
    <path d="M7.33 12.25l-.006.01-.002-.004-1.342 2.34 1.59 2.765-2.24 3.85.684 1.182H7.35l.004-.006h.001l1.567-2.698 1.558 2.72 2.688-.026-.004-.006h.01L7.33 12.25z" fill="#fb4934"/>
    
    <!-- Arm 6 (Bottom Right): Purple -->
    <path d="M9.882 16.18l1.354 2.332 3.192.006 2.215 3.865 1.363-.002.668-1.156-1.557-2.713 3.137.008 1.32-2.34H9.881Z" fill="#d3869b"/>
  </g>
</svg>
