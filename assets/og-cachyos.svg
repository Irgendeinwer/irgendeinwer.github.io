<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background Dot Pattern -->
    <pattern id="dot-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.5" fill="#32302f" />
    </pattern>

    <!-- Drop Shadow for Terminal Card -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Radial Glow behind Gauge -->
    <radialGradient id="cachy-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ec07c" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#b8bb26" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#282828" stop-opacity="0"/>
    </radialGradient>

    <style>
      .mono-title { font-family: 'JetBrains Mono', 'Fira Code', 'FiraCode Nerd Font', monospace, sans-serif; font-weight: 900; }
      .mono-bold  { font-family: 'JetBrains Mono', 'Fira Code', 'FiraCode Nerd Font', monospace, sans-serif; font-weight: 700; }
      .mono-med   { font-family: 'JetBrains Mono', 'Fira Code', 'FiraCode Nerd Font', monospace, sans-serif; font-weight: 600; }
      .mono-reg   { font-family: 'JetBrains Mono', 'Fira Code', 'FiraCode Nerd Font', monospace, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="#1d2021"/>
  <rect width="1200" height="630" fill="url(#dot-grid)"/>

  <!-- Main Terminal Window Card -->
  <g filter="url(#card-shadow)">
    <rect x="50" y="45" width="1100" height="540" rx="16" fill="#282828" stroke="#3c3836" stroke-width="2"/>
    
    <!-- Window Title Bar -->
    <path d="M 50,61 A 16,16 0 0 1 66,45 L 1134,45 A 16,16 0 0 1 1150,61 L 1150,96 L 50,96 Z" fill="#1d2021"/>
    <line x1="50" y1="96" x2="1150" y2="96" stroke="#3c3836" stroke-width="1.5"/>

    <!-- Window Control Buttons -->
    <circle cx="80" cy="71" r="6.5" fill="#fb4934"/>
    <circle cx="102" cy="71" r="6.5" fill="#fabd2f"/>
    <circle cx="124" cy="71" r="6.5" fill="#b8bb26"/>

    <!-- Terminal Header Info -->
    <text x="600" y="76" text-anchor="middle" class="mono-med" font-size="13" fill="#a89984">julian@junixos: ~/blog/cachyos-kernel-on-nixos</text>
  </g>

  <!-- ================= LEFT COLUMN: CONTENT ================= -->
  <!-- Pill Badge -->
  <g transform="translate(90, 126)">
    <rect width="195" height="26" rx="5" fill="#8ec07c" fill-opacity="0.15" stroke="#8ec07c" stroke-opacity="0.4" stroke-width="1"/>
    <text x="97.5" y="17.5" text-anchor="middle" class="mono-bold" font-size="11.5" fill="#8ec07c" letter-spacing="0.5">⚡ LINUX KERNEL &amp; GAMING</text>
  </g>

  <!-- Article Heading -->
  <text x="90" y="202" class="mono-title" font-size="44" fill="#ebdbb2" letter-spacing="-0.5">Running CachyOS</text>
  <text x="90" y="248" class="mono-title" font-size="44" fill="#fabd2f" letter-spacing="-0.5">Kernels on NixOS<tspan fill="#fe8019">.</tspan></text>
  <text x="90" y="286" class="mono-med" font-size="15" fill="#a89984">Zero local compilation using pre-built BORE &amp; Attic caches</text>

  <!-- Spec / Code Box -->
  <g transform="translate(90, 318)">
    <rect width="560" height="135" rx="8" fill="#1d2021" stroke="#3c3836" stroke-width="1.2"/>
    <text x="20" y="30" class="mono-bold" font-size="13" fill="#83a598"># flake.nix kernel configuration</text>
    
    <text x="20" y="58" class="mono-reg" font-size="13" fill="#ebdbb2"><tspan fill="#fe8019">boot.kernelPackages</tspan> = pkgs.cachyos.linuxPackages-cachyos-bore;</text>
    <text x="20" y="84" class="mono-reg" font-size="13" fill="#ebdbb2"><tspan fill="#fe8019">nix.settings.substituters</tspan> = [ <tspan fill="#b8bb26">"https://attic.cachyos.org/..."</tspan> ];</text>
    <text x="20" y="110" class="mono-reg" font-size="13" fill="#ebdbb2"><tspan fill="#8ec07c">✓ Result:</tspan> Instant ~200MB binary pull instead of 2h CPU build</text>
  </g>

  <!-- Tag Badges -->
  <g transform="translate(90, 480)" class="mono-reg" font-size="12">
    <rect x="0" y="0" width="85" height="26" rx="5" fill="#32302f" stroke="#504945"/>
    <text x="42.5" y="17.5" text-anchor="middle" fill="#8ec07c">#cachyos</text>

    <rect x="95" y="0" width="120" height="26" rx="5" fill="#32302f" stroke="#504945"/>
    <text x="155" y="17.5" text-anchor="middle" fill="#fabd2f">#bore-scheduler</text>

    <rect x="225" y="0" width="105" height="26" rx="5" fill="#32302f" stroke="#504945"/>
    <text x="277.5" y="17.5" text-anchor="middle" fill="#83a598">#attic-cache</text>

    <rect x="340" y="0" width="75" height="26" rx="5" fill="#32302f" stroke="#504945"/>
    <text x="377.5" y="17.5" text-anchor="middle" fill="#d3869b">#gaming</text>
  </g>

  <!-- ================= RIGHT COLUMN: GRAPHIC ================= -->
  <circle cx="900" cy="335" r="175" fill="url(#cachy-glow)"/>
  <circle cx="900" cy="335" r="145" fill="none" stroke="#504945" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.35"/>

  <!-- Stylized High-Performance CPU & Rocket Element -->
  <g transform="translate(775, 210)">
    <!-- CPU Die Box -->
    <rect x="40" y="30" width="170" height="170" rx="14" fill="#1d2021" stroke="#8ec07c" stroke-width="2.5"/>
    <rect x="60" y="50" width="130" height="130" rx="8" fill="#282828" stroke="#3c3836" stroke-width="1.5"/>

    <!-- Pins -->
    <g fill="#fabd2f">
      <rect x="65" y="18" width="6" height="12" rx="1"/>
      <rect x="85" y="18" width="6" height="12" rx="1"/>
      <rect x="105" y="18" width="6" height="12" rx="1"/>
      <rect x="125" y="18" width="6" height="12" rx="1"/>
      <rect x="145" y="18" width="6" height="12" rx="1"/>
      <rect x="165" y="18" width="6" height="12" rx="1"/>

      <rect x="65" y="200" width="6" height="12" rx="1"/>
      <rect x="85" y="200" width="6" height="12" rx="1"/>
      <rect x="105" y="200" width="6" height="12" rx="1"/>
      <rect x="125" y="200" width="6" height="12" rx="1"/>
      <rect x="145" y="200" width="6" height="12" rx="1"/>
      <rect x="165" y="200" width="6" height="12" rx="1"/>
    </g>

    <!-- Core Center Graphic -->
    <text x="125" y="98" text-anchor="middle" class="mono-bold" font-size="15" fill="#8ec07c">BORE</text>
    <text x="125" y="118" text-anchor="middle" class="mono-bold" font-size="11" fill="#fabd2f">SCHEDULER</text>
    <line x1="80" y1="130" x2="170" y2="130" stroke="#504945" stroke-width="1"/>
    <text x="125" y="152" text-anchor="middle" class="mono-med" font-size="11" fill="#b8bb26">⚡ 0.1ms LATENCY</text>
  </g>
</svg>
